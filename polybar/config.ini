; vim:ft=dosini

[colors]
background = #000000
background-alt = #333333
foreground = #C5C8C6
primary = #13A10E
secondary = #8ABEB7
alert = #fc0303
disabled = #707880

[bar/infobar]
width = 100%
height = 24pt
radius = 0
bottom = true
monitor= {{display_main}}

{{#if polybar_dpi}}
dpi = {{polybar_dpi}}
{{else}}
dpi = {{dpi}}
{{/if}}

background = ${colors.background}
foreground = ${colors.foreground}

line-size = 3pt

border-size = 0pt
border-color = #00000000

padding-left = 1
padding-right = 1

module-margin = 1

separator = |
separator-foreground = ${colors.disabled}

font-0 = "{{poly_font_name}}:size={{poly_font_size}};2"
font-1 = "Hack Nerd Font:size={{poly_font_size}};1"

; modules-left = xworkspaces xwindow
; modules-right = filesystem pulseaudio xkeyboard memory cpu wlan eth date
modules-left = is-mullvad-running updates-pacman updates-aur
modules-center = spotify spotify-prev spotify-play-pause spotify-next
modules-right = filesystem backlight pulseaudio cpu memory wlan eth date

fixed-center = false

cursor-click = pointer
cursor-scroll = ns-resize

enable-ipc = true

; wm-restack = generic
; wm-restack = bspwm
wm-restack = i3

; override-redirect = true
;
[module/is-mullvad-running]
type = custom/script
exec = ~/.config/polybar/scripts/is-mullvad-running.sh
interval = 5
label = vpn: %output%
format-foreground = ${colors.primary}
format-fail = %{F#fc0303}vpn: inactive%{F-}

[module/kernel]
type = custom/script
exec = uname -r
interval = 60
label =   %output%


[module/filesystem]
type = internal/fs
interval = 25

mount-0 = /

label-mounted = %{F#13A10E}%mountpoint%%{F-} %free%

label-unmounted = %mountpoint% not mounted
label-unmounted-foreground = ${colors.disabled}

[module/pulseaudio]
type = internal/pulseaudio

format-volume-prefix = "VOL "
format-volume-prefix-foreground = ${colors.primary}
format-volume = <label-volume>

label-volume = %percentage%%

label-muted = muted
label-muted-foreground = ${colors.disabled}

[module/backlight]
type = internal/backlight

; Use the following command to list available cards:
; $ ls -1 /sys/class/backlight/
; Default: first usable card in /sys/class/backlight (new in version 3.7.0)
card = intel_backlight
format = 󰃝  <label>

[module/memory]
type = internal/memory
interval = 3
label = RAM %gb_used%
warn-percentage = 90

[module/cpu]
type = internal/cpu
interval = 2
format-prefix = "CPU "
format-prefix-foreground = ${colors.primary}
label = %percentage:2%%

[network-base]
type = internal/network
interval = 5
format-connected = <label-connected>
format-disconnected = ""
label-disconnected = %{F#13A10E}%ifname%%{F#707880} disconnected

[module/wlan]
inherit = network-base
interface-type = wireless
label-connected = %{F#13A10E}%ifname%%{F-} %essid% - %local_ip%
format-disconnected = ""

[module/eth]
inherit = network-base
interface-type = wired
label-connected = %{F#13A10E}%ifname%%{F-} %local_ip%

[module/date]
type = internal/date
interval = 1

date = %H:%M
date-alt = %Y-%m-%d %H:%M:%S

label = %date%
label-foreground = ${colors.primary}

[module/updates-aur]
type = custom/script
exec = ~/.config/polybar/scripts/updates-aur.sh
interval = 600

[module/updates-pacman]
type = custom/script
exec = ~/.config/polybar/scripts/updates-pacman.sh
interval = 600

[settings]
screenchange-reload = true
pseudo-transparency = true

[module/spotify]
type = custom/script
tail = true
interval = 1
; prefix symbol is shown before the text
format-prefix = "  "
format = <label>
exec = ~/.config/polybar/scripts/scroll_spotify_status.sh

[module/spotify-prev]
type = custom/script
exec = echo "󰼨"
format = <label>
click-left = playerctl previous -p spotify

[module/spotify-play-pause]
type = custom/ipc
hook-0 = echo "󰏤"
hook-1 = echo "󰼛"
initial = 1
click-left = playerctl play-pause -p spotify

[module/spotify-next]
type = custom/script
exec = echo "󰼧"
format = <label>
click-left = playerctl next -p spotify

; ---------------------------------------------------------------------------
; Top bars (replace i3bar + i3blocks), same dark theme as infobar.

[colors-top]
; same dark theme as the bottom bar ([colors])
background = ${colors.background}
foreground = ${colors.foreground}
separator = ${colors.disabled}
accent = ${colors.primary}
ws-focused-bg = ${colors.primary}
ws-focused-fg = #000000
ws-visible-bg = ${colors.background-alt}
ws-visible-fg = ${colors.foreground}
ws-unfocused-bg = ${colors.background}
ws-unfocused-fg = ${colors.foreground}
urgent-bg = ${colors.alert}
urgent-fg = #ffffff

[bar/top-base]
width = 100%
; claude-notch pill sits on this bar (claude-notch/config.toml pill_height)
height = 25
bottom = false

{{#if polybar_dpi}}
dpi = {{polybar_dpi}}
{{else}}
dpi = {{dpi}}
{{/if}}

background = ${colors-top.background}
foreground = ${colors-top.foreground}

padding-left = 0
padding-right = 1
module-margin = 1

separator = |
separator-foreground = ${colors-top.separator}

; Terminus is a bitmap font: 16px is what size 12 gives in Alacritty at 92 dpi
font-0 = "Terminus:pixelsize=16;2"
; icons (bell, calendar) and emoji in window titles
font-1 = "Hack Nerd Font:size=12;3"
font-2 = "Noto Color Emoji:scale=10;3"

cursor-click = pointer
enable-ipc = true

[bar/top]
inherit = bar/top-base
monitor = {{display_main}}
modules-left = i3 xwindow
{{#if enable_bar_battery}}
modules-right = task dnd time calendar battery tray
{{else}}
modules-right = task dnd time calendar tray
{{/if}}

[bar/top-second]
inherit = bar/top-base
monitor = {{display_second}}
fixed-center = true
modules-left = i3
modules-center = task
modules-right = time-utc time-local

[module/i3]
type = internal/i3
; each bar only shows the workspaces on its own monitor
pin-workspaces = true
index-sort = true
enable-scroll = false
format = <label-state> <label-mode>

label-mode = %mode%
label-mode-padding = 1
label-mode-background = ${colors-top.urgent-bg}
label-mode-foreground = ${colors-top.urgent-fg}

label-focused = %name%
label-focused-padding = 5px
label-focused-background = ${colors-top.ws-focused-bg}
label-focused-foreground = ${colors-top.ws-focused-fg}

label-visible = %name%
label-visible-padding = 5px
label-visible-background = ${colors-top.ws-visible-bg}
label-visible-foreground = ${colors-top.ws-visible-fg}

label-unfocused = %name%
label-unfocused-padding = 5px
label-unfocused-background = ${colors-top.ws-unfocused-bg}
label-unfocused-foreground = ${colors-top.ws-unfocused-fg}

label-urgent = %name%
label-urgent-padding = 5px
label-urgent-background = ${colors-top.urgent-bg}
label-urgent-foreground = ${colors-top.urgent-fg}

[module/xwindow]
type = internal/xwindow
; focused window title, in place of i3 title bars. Keep it short enough to
; stay clear of the claude-notch in the middle of the bar.
label = %title:0:80:…%
label-empty =

[module/task]
type = custom/script
exec = ~/.config/polybar/scripts/task.sh
interval = 2
; left click: set the task, right click: clear it
click-left = BLOCK_BUTTON=1 ~/.config/polybar/scripts/task.sh >/dev/null
click-right = BLOCK_BUTTON=3 ~/.config/polybar/scripts/task.sh >/dev/null

[module/dnd]
type = custom/script
exec = ~/.config/polybar/scripts/dnd.sh
interval = 1
click-left = ~/.config/polybar/scripts/dnd.sh toggle >/dev/null
click-right = ~/.config/polybar/scripts/dnd.sh history >/dev/null

[module/time]
type = custom/script
exec = ~/.config/polybar/scripts/time-tz.sh
interval = 1
; left click cycles MNL -> UTC -> AU
click-left = ~/.config/polybar/scripts/time-tz.sh next >/dev/null
label-foreground = ${colors-top.accent}

[module/calendar]
type = custom/script
exec = date +%H:%M:%S
interval = 1
format-prefix = " "
format-prefix-foreground = ${colors-top.accent}
click-left = yad --calendar --width=220 --height=180 --undecorated --fixed --close-on-unfocus --no-buttons --mouse >/dev/null

{{#if enable_bar_battery}}
[module/battery]
type = custom/script
exec = ~/.config/polybar/scripts/battery
interval = 5
{{/if}}

[module/tray]
type = internal/tray
tray-spacing = 4px

[module/time-utc]
type = custom/script
exec = date -u '+UTC %Y/%m/%d %H:%M'
interval = 5

[module/time-local]
type = custom/script
exec = date '+UTC+8 %Y/%m/%d %H:%M'
interval = 5
